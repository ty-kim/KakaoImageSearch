name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint (strict)
        run: swiftlint lint --strict

  test:
    name: Build & Test
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Build & Unit/Integration Test
        run: |
          xcrun simctl boot "iPhone 17" || true
          sleep 3
          xcrun simctl spawn "iPhone 17" defaults write com.apple.Preferences ConnectHardwareKeyboard -bool false
          xcrun simctl spawn "iPhone 17" defaults write com.apple.Preferences AutomaticMinimizationEnabled -bool false
          sleep 3
          echo 'enum KakaoAPIKey { static let restAPIKey = "test-key" }' > KakaoAPIKey.swift
          xcodebuild -project KakaoImageSearch.xcodeproj \
            -scheme KakaoImageSearch \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -testPlan UnitTests \
            -resultBundlePath TestResults.xcresult \
            test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults.xcresult
